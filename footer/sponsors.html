<!-- Site-wide sponsors footer. Paste this whole file into one custom HTML block at the bottom of a Hivebrite page. Requires jQuery (already on Hivebrite). No // comments: Hivebrite removes line breaks. -->
<div id="sponsors"></div>
<style>
  #sponsors { display: flex !important; flex-wrap: wrap !important; justify-content: center; align-items: center; padding: 40px 1rem; margin-top: 48px; background: #013a81; box-shadow: 0 0 0 100vmax #013a81; clip-path: inset(0 -100vmax); opacity: 0; transition: opacity 0.6s ease; }
  #sponsors.loaded { opacity: 1; }
  #sponsors .sponsors { width: 100%; max-width: 1100px; margin: 0 auto; }
  #sponsors .sponsors h2 { text-align: center; margin: 0 0 16px; transform: none !important; }
  #sponsors .sponsor_grid { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px 32px; }
  #sponsors .sponsor { width: auto; flex: 0 0 auto; }
  #sponsors .sponsor img { width: 130px; max-width: 130px; height: auto; transition: transform 0.3s ease; }
  #sponsors .sponsor img:hover { transform: scale(1.1); }
</style>
<script>
  $(document).ready(function () {
    $('#sponsors').load('https://cdn.jsdelivr.net/gh/pec0ra/sas-website@vlatest/sponsors-with-css.html', function () {
      $('#sponsors').addClass('loaded');
    });
  });
</script>
