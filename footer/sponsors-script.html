<!-- Loads the sponsor logos into the #sponsors container from footer/sponsors.html. Requires jQuery (already loaded on Hivebrite). -->
<script>
  $(document).ready(function () {
    $('#sponsors').load(
      'https://cdn.jsdelivr.net/gh/pec0ra/sas-website@vlatest/sponsors-with-css.html',
      function () {
        $('#sponsors').addClass('loaded');
      }
    );
  });
</script>
