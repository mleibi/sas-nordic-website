<!-- Local-only dev preview, not for Hivebrite. Fetches the shared page-content.html from a local relative path so edits show without pushing. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SAS Nordic Team — preview</title>
<!-- jQuery is only needed here for the local preview; Hivebrite already loads it on the live site. -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body style="font-family: sans-serif; padding: 20px;">

  <div style="margin-bottom: 20px;">
    <strong>Preview language:</strong>
    <button onclick="loadLang('en')">EN</button>
    <button onclick="loadLang('fr')">FR</button>
    <button onclick="loadLang('de')">DE</button>
  </div>

  <div id="sas-nordic-welcome" style="font-family: inherit; max-width: 800px; margin: 0 auto; line-height: 1.6;"></div>

<script>
// Preview always loads the athlete roster/captions in English; the buttons above only retranslate on-page text (see loadLang below).
var LANG = "en";
var BASE = "pages/nordic-team/";
fetch(BASE + "page-content.html", { cache: "no-store" }).then(function (r) { return r.text(); }).then(function (html) {
  var root = document.getElementById('sas-nordic-welcome');
  root.innerHTML = html;
  root.querySelectorAll('script').forEach(function (old) { // innerHTML-inserted scripts are inert; re-create them so they run
    var s = document.createElement('script');
    for (var i = 0; i < old.attributes.length; i++) s.setAttribute(old.attributes[i].name, old.attributes[i].value);
    s.textContent = old.textContent;
    old.parentNode.replaceChild(s, old);
  });
});

function loadLang(lang) {
  var LINKS = {
    performance_criteria_link: { url: 'https://swissuniversitysports.ch/sportarten/ski-nordisch-2/', attrs: 'target="_blank" rel="noopener"', textKey: 'wwug_criteria_link_text' },
    marcel_ott_link: { url: 'mailto:chef-nordic@sas-ski.ch', attrs: '', textKey: 'wwug_contact_link_text' },
    official_site_link: { url: 'https://www.changchun2027.com.cn/?uc_sm=1', attrs: 'target="_blank" rel="noopener"', textKey: 'wwug_official_site_link_text' }
  };
  fetch(BASE + 'labels/' + lang + '.json', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (labels) {
      document.querySelectorAll('#sas-nordic-welcome [data-i18n]').forEach(function (el) {
        var key = el.getAttribute('data-i18n');
        if (labels[key] !== undefined) el.textContent = labels[key];
      });
      document.querySelectorAll('#sas-nordic-welcome [data-i18n-alt]').forEach(function (el) {
        var key = el.getAttribute('data-i18n-alt');
        if (labels[key] !== undefined) el.alt = labels[key];
      });
      document.querySelectorAll('#sas-nordic-welcome [data-i18n-template]').forEach(function (el) {
        var key = el.getAttribute('data-i18n-template');
        var template = labels[key];
        if (template === undefined) return;
        el.innerHTML = template.replace(/\{(\w+)\}/g, function (match, name) {
          var link = LINKS[name];
          if (!link) return match;
          var text = labels[link.textKey] !== undefined ? labels[link.textKey] : name;
          return '<a href="' + link.url + '" ' + link.attrs + '>' + text + '</a>';
        });
      });
    });
}
</script>

<!-- Footer preview: copy of footer/sponsors.html -->
<div id="sponsors"></div>
<style>
  #sponsors { display: flex !important; flex-wrap: wrap !important; justify-content: center; align-items: center; padding: 40px 1rem; margin-top: 48px; background: #013a81; box-shadow: 0 0 0 100vmax #013a81; clip-path: inset(0 -100vmax); opacity: 0; transition: opacity 0.6s ease; }
  #sponsors.loaded { opacity: 1; }
  #sponsors .sponsors { width: 100%; max-width: 1100px; margin: 0 auto; }
  #sponsors .sponsors h2 { text-align: center; margin: 0 0 16px; transform: none !important; }
  #sponsors .sponsor_grid { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px 32px; }
  #sponsors .sponsor { width: auto; flex: 0 0 auto; }
  #sponsors .sponsor img { width: 130px; max-width: 130px; height: auto; transition: transform 0.3s ease; }
  #sponsors .sponsor img:hover { transform: scale(1.1); }
</style>
<script>
  $(document).ready(function () {
    $('#sponsors').load('https://cdn.jsdelivr.net/gh/pec0ra/sas-website@vlatest/sponsors-with-css.html', function () {
      $('#sponsors').addClass('loaded');
    });
  });
</script>
</body>
</html>
