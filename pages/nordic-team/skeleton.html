<!-- Paste this exact block into each of the 3 Hivebrite "Nordic Team" pages (EN/FR/DE). -->
<!-- This file only sets LANG and loads page-content.html from git via jsDelivr. All logic lives in page-content.html. -->
<!-- Edit the real page (sections, text) in page-content.html and labels/*.json instead. -->
<div id="sas-nordic-welcome" style="font-family: inherit; max-width: 800px; margin: 0 auto; line-height: 1.6;"></div>
<script>
var LANG = "en"; /* only line that changes between the EN/FR/DE Hivebrite pages: "en" | "fr" | "de" */
var BASE = "https://cdn.jsdelivr.net/gh/mleibi/sas-nordic-website@main/pages/nordic-team/";
fetch(BASE + 'page-content.html', { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (html) {
  var root = document.getElementById('sas-nordic-welcome');
  root.innerHTML = html;
  root.querySelectorAll('script').forEach(function (old) {
    var s = document.createElement('script');
    for (var i = 0; i < old.attributes.length; i++) s.setAttribute(old.attributes[i].name, old.attributes[i].value);
    s.textContent = old.textContent;
    old.parentNode.replaceChild(s, old);
  });
  if (typeof window.loadLabels === 'function') window.loadLabels();
});
</script>
