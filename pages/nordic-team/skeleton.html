<!-- Paste into Hivebrite. Loads content from GitHub via jsDelivr. -->
<div id="sas-nordic-welcome" style="font-family: inherit; max-width: 800px; margin: 0 auto; line-height: 1.6;"></div>
<script>
(function () {
  window.LANG = "en"; /* "en", "fr" or "de" */
  window.BASE = "https://cdn.jsdelivr.net/gh/mleibi/sas-nordic-website@main/pages/nordic-team/";

  fetch(window.BASE + "page-content.html")
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
    .then(function (html) {
      var root = document.getElementById("sas-nordic-welcome");
      root.innerHTML = html;
      /* Scripts inserted via innerHTML do not run; recreate them so they do. */
      root.querySelectorAll("script").forEach(function (old) {
        var s = document.createElement("script");
        for (var i = 0; i < old.attributes.length; i++) s.setAttribute(old.attributes[i].name, old.attributes[i].value);
        s.textContent = old.textContent;
        old.parentNode.replaceChild(s, old);
      });
    })
    .catch(function (e) { console.error("[sas-nordic] load failed:", e); });
})();
</script>
