<!-- Shared custom HTML block for all 3 Hivebrite "Nordic Team" pages. -->

<!-- Edit wording in labels/en.json, labels/fr.json, labels/de.json, not here. -->
<script>
  var LANG = "en"; // <-- only line that changes between the EN/FR/DE Hivebrite pages: "en" | "fr" | "de"
</script>
<div id="sas-nordic-welcome" style="font-family: inherit; max-width: 800px; margin: 0 auto; line-height: 1.6;">

  <!-- Hero photo carousel: add/remove hero-slide <img> tags to match the files in pages/nordic-team/hero/ -->
  <div class="hero-carousel" style="position: relative; width: 100%; aspect-ratio: 16 / 6; overflow: hidden; border-radius: 8px; margin-bottom: 20px;">
    <img class="hero-slide" src="https://cdn.jsdelivr.net/gh/mleibi/sas-nordic-website@main/pages/nordic-team/hero/hero-1.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1.2s ease;">
    <img class="hero-slide" src="https://cdn.jsdelivr.net/gh/mleibi/sas-nordic-website@main/pages/nordic-team/hero/hero-2.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1.2s ease;">
    <img class="hero-slide" src="https://cdn.jsdelivr.net/gh/mleibi/sas-nordic-website@main/pages/nordic-team/hero/hero-3.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1.2s ease;">
  </div>
  <script>
    (function () {
      var slides = document.querySelectorAll('#sas-nordic-welcome .hero-slide');
      if (!slides.length) return;
      var i = 0;
      slides[0].style.opacity = '1';
      setInterval(function () {
        slides[i].style.opacity = '0';
        i = (i + 1) % slides.length;
        slides[i].style.opacity = '1';
      }, 4000);
    })();
  </script>

  <script>
    function loadAthleteTeam(containerId, teamName) {
      window.addAthlete(containerId, teamName, LANG);
    }
    (function () {
      var scriptTag = document.createElement('script');
      scriptTag.type = 'text/javascript';
      scriptTag.src = 'https://cdn.jsdelivr.net/gh/pec0ra/sas-website@latest/sas_users-with-css.js';
      scriptTag.onload = function () {
        loadAthleteTeam('#nordicw', 'Nordic Women Team');
        loadAthleteTeam('#nordicm', 'Nordic Men Team');
      };
      document.body.appendChild(scriptTag);
    })();

  <!-- TODO: Staff athlete grid goes here once its container id + team-name query is confirmed. -->

  <style>
    .users {
      gap: 2rem;
      justify-content: center;
      padding-top: 2.5rem;
      overflow: visible;
    }

    .users > * {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      animation: athlete-in 0.5s ease backwards;
      border-radius: 8px;
      overflow: hidden; /* clip the zoomed image to the card's rounded corners */
      padding: 10px; /* breathing room so the hover zoom doesn't clip the image/name */
      box-sizing: border-box;
    }

    .users > *:hover {
      transform: translateY(-8px) scale(1.06);
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.2);
      z-index: 5;
      position: relative;
    }

    .users img {
      transition: transform 0.4s ease;
    }
    .users > *:hover img {
      transform: scale(1.08);
    }

    @keyframes athlete-in {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }

    <li data-i18n-template="wwug_criteria_item_3"></li>
  </ul>
  <p data-i18n-template="wwug_contact_p"></p>

</div>

<script>
(function () {
  var BASE = "https://cdn.jsdelivr.net/gh/mleibi/sas-nordic-website@main/pages/nordic-team/labels/";

  // Fixed, non-translated link targets. Labels only supply translated link text via {placeholder} tokens.
  var LINKS = {
    performance_criteria_link: { url: 'https://swissuniversitysports.ch/sportarten/ski-nordisch-2/', attrs: 'target="_blank" rel="noopener"', textKey: 'wwug_criteria_link_text' },
    marcel_ott_link: { url: 'mailto:chef-nordic@sas-ski.ch', attrs: '', textKey: 'wwug_contact_link_text' }
  };

  fetch(BASE + LANG + ".json")
    .then(function (r) { return r.json(); })
    .then(function (labels) {
      document.querySelectorAll('#sas-nordic-welcome [data-i18n]').forEach(function (el) {
        var key = el.getAttribute('data-i18n');
        if (labels[key] !== undefined) el.textContent = labels[key];
      });
      document.querySelectorAll('#sas-nordic-welcome [data-i18n-template]').forEach(function (el) {
        var key = el.getAttribute('data-i18n-template');
        var template = labels[key];
        if (template === undefined) return;
        el.innerHTML = template.replace(/\{(\w+)\}/g, function (match, name) {
          var link = LINKS[name];
          if (!link) return match;
          var text = labels[link.textKey] !== undefined ? labels[link.textKey] : name;
          return '<a href="' + link.url + '" ' + link.attrs + '>' + text + '</a>';
        });
      });
    });
})();
</script>
