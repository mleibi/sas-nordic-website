<!-- Standalone version for Hivebrite: paste THIS directly into the page (no skeleton needed) -->
<!-- All content, styles, and i18n embedded - no external dependencies -->
<div id="sas-nordic-welcome" style="font-family: inherit; max-width: 800px; margin: 0 auto; line-height: 1.6;"></div>
<script>
(function () {
  // Embedded English labels
  var labels = {
    "welcome_title":"Welcome to the SAS Nordic Team!",
    "welcome_p1":"The SAS Nordic Team is a regional association of Swiss-Ski that is open to students who are passionate about nordic skiing competitions. In the summer, we offer training camps and coaching, and in the winter, our athletes compete in various competitions. Our main focus is on cross-country skiing, for which we provide professional support for the Swiss Cup racing series.",
    "welcome_p2":"Additionally, we also promote athletes in other Nordic sports such as biathlon, ski orienteering, Nordic combined, and ski jumping, although we do not provide specific training and competition support for these disciplines.",
    "join_us_label":"Join us",
    "disciplines_title":"Disciplines",
    "discipline_cc_title":"Cross Country Skiing",
    "discipline_biathlon_title":"Biathlon",
    "discipline_sko_title":"Ski-Orienteering",
    "hero_photo_alt":"SAS Nordic Team athletes",
    "discipline_cc_alt":"Cross country skiing icon",
    "discipline_biathlon_alt":"Biathlon icon",
    "discipline_sko_alt":"Ski-orienteering icon",
    "offer_title":"Offer",
    "what_title":"What do we offer?",
    "what_item_1":"Monthly training camps from June to November",
    "what_item_2":"Race support including waxing and accommodation",
    "what_item_3":"Individual coaching for technique and training",
    "what_item_4":"Unique SAS Spirit",
    "offer_what_alt":"SAS Nordic Team training camp",
    "offer_who_alt":"SAS Nordic Team athletes racing",
    "offer_comp_alt":"SAS Nordic Team at a competition",
    "who_title":"Who are we aimed at?",
    "who_item_1":"FIS athletes pursuing a dual career",
    "who_item_2":"Ex-FIS athletes starting an academic path who would like to stay attached with racing",
    "who_item_3":"Ambitious students (mass sport) when free spots are available",
    "comp_title":"Our Competitions and Events",
    "comp_item_1":"Swiss Cup series",
    "comp_item_2":"Selected FESA Cup races, sometimes in collaboration with other teams",
    "comp_item_3":"Universiade (every 2 years)",
    "comp_item_4":"Selected Swiss Loppet races",
    "comp_item_5":"SAS Events such as the Pentathlon",
    "comp_item_6":"Swiss University Sport Events",
    "athletes_title":"Athletes",
    "athletes_women_title":"Women",
    "athletes_men_title":"Men",
    "staff_title":"Staff",
    "staff_manager_role":"Nordic Manager",
    "staff_manager_name":"Matthias Leibundgut",
    "staff_coach_role":"Nordic Coach",
    "staff_coach_name":"Jonatan Engdahl",
    "staff_contact_label":"Contact",
    "wwug_title":"Universiade",
    "wwug_photo_alt":"Cross country skiers at the Universiade",
    "countdown_days":"Days",
    "countdown_hours":"Hours",
    "countdown_minutes":"Minutes",
    "wwug_p1":"The Universiade is the Olympic Games for university students. In close collaboration with Swiss University Sports, SAS is involved in the support of the Nordic disciplines.",
    "wwug_location_p":"📍 Changchun, China — {official_site_link}",
    "wwug_official_site_link_text":"Official website",
    "wwug_criteria_title":"Criteria:",
    "wwug_criteria_item_1":"Enrolled at a university or college",
    "wwug_criteria_item_2":"Age: 28 years or younger",
    "wwug_criteria_item_3":"Fulfillment of the {performance_criteria_link} set by Swiss University Sports",
    "wwug_criteria_link_text":"performance criteria",
    "wwug_contact_p":"For applications, please contact {marcel_ott_link}, the Nordic Coordinator at Swiss University Sports.",
    "wwug_contact_link_text":"Marcel Ott"
  };

  function populateLabels() {
    var LINKS = {
      performance_criteria_link: { url: 'https://swissuniversitysports.ch/sportarten/ski-nordisch-2/', attrs: 'target="_blank" rel="noopener"', textKey: 'wwug_criteria_link_text' },
      marcel_ott_link: { url: 'mailto:chef-nordic@sas-ski.ch', attrs: '', textKey: 'wwug_contact_link_text' },
      official_site_link: { url: 'https://www.changchun2027.com.cn/?uc_sm=1', attrs: 'target="_blank" rel="noopener"', textKey: 'wwug_official_site_link_text' }
    };
    document.querySelectorAll('#sas-nordic-welcome [data-i18n]').forEach(function (el) {
      var key = el.getAttribute('data-i18n');
      if (labels[key] !== undefined) el.textContent = labels[key];
    });
    document.querySelectorAll('#sas-nordic-welcome [data-i18n-alt]').forEach(function (el) {
      var key = el.getAttribute('data-i18n-alt');
      if (labels[key] !== undefined) el.alt = labels[key];
    });
    document.querySelectorAll('#sas-nordic-welcome [data-i18n-template]').forEach(function (el) {
      var key = el.getAttribute('data-i18n-template');
      var template = labels[key];
      if (template === undefined) return;
      el.innerHTML = template.replace(/\{(\w+)\}/g, function (match, name) {
        var link = LINKS[name];
        if (!link) return match;
        var text = labels[link.textKey] !== undefined ? labels[link.textKey] : name;
        return '<a href="' + link.url + '" ' + link.attrs + '>' + text + '</a>';
      });
    });
  }

  // Inject HTML content
  var html = `
<h2 data-i18n="welcome_title"></h2>
<p data-i18n="welcome_p1"></p>
<p data-i18n="welcome_p2"></p>

<h2 id="disciplines" data-i18n="disciplines_title"></h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin: 20px 0;">
  <div style="text-align: center;">
    <div style="width: 100px; height: 100px; background: #0a3d62; border-radius: 50%; margin: 0 auto 10px;"></div>
    <h4 data-i18n="discipline_cc_title" style="margin: 10px 0;"></h4>
  </div>
  <div style="text-align: center;">
    <div style="width: 100px; height: 100px; background: #0a3d62; border-radius: 50%; margin: 0 auto 10px;"></div>
    <h4 data-i18n="discipline_biathlon_title" style="margin: 10px 0;"></h4>
  </div>
  <div style="text-align: center;">
    <div style="width: 100px; height: 100px; background: #0a3d62; border-radius: 50%; margin: 0 auto 10px;"></div>
    <h4 data-i18n="discipline_sko_title" style="margin: 10px 0;"></h4>
  </div>
</div>

<h2 id="offer" data-i18n="offer_title"></h2>
<h3 data-i18n="what_title"></h3>
<ul>
  <li data-i18n="what_item_1"></li>
  <li data-i18n="what_item_2"></li>
  <li data-i18n="what_item_3"></li>
  <li data-i18n="what_item_4"></li>
</ul>

<h3 data-i18n="who_title"></h3>
<ul>
  <li data-i18n="who_item_1"></li>
  <li data-i18n="who_item_2"></li>
  <li data-i18n="who_item_3"></li>
</ul>

<h3 data-i18n="comp_title"></h3>
<ul>
  <li data-i18n="comp_item_1"></li>
  <li data-i18n="comp_item_2"></li>
  <li data-i18n="comp_item_3"></li>
  <li data-i18n="comp_item_4"></li>
  <li data-i18n="comp_item_5"></li>
  <li data-i18n="comp_item_6"></li>
</ul>

<h2 id="staff" data-i18n="staff_title"></h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px;">
  <div style="text-align: center;">
    <div style="width: 120px; height: 120px; background: #ddd; border-radius: 50%; margin: 0 auto 10px;"></div>
    <h4 data-i18n="staff_manager_name" style="margin: 5px 0;"></h4>
    <p data-i18n="staff_manager_role" style="font-size: 0.9em; color: #666;"></p>
  </div>
  <div style="text-align: center;">
    <div style="width: 120px; height: 120px; background: #ddd; border-radius: 50%; margin: 0 auto 10px;"></div>
    <h4 data-i18n="staff_coach_name" style="margin: 5px 0;"></h4>
    <p data-i18n="staff_coach_role" style="font-size: 0.9em; color: #666;"></p>
  </div>
</div>

<h2 id="wwug" data-i18n="wwug_title"></h2>
<p data-i18n="wwug_p1"></p>
<p data-i18n-template="wwug_location_p"></p>
<h3 data-i18n="wwug_criteria_title"></h3>
<ul>
  <li data-i18n="wwug_criteria_item_1"></li>
  <li data-i18n="wwug_criteria_item_2"></li>
  <li data-i18n="wwug_criteria_item_3"></li>
</ul>
<p data-i18n-template="wwug_contact_p"></p>
  `;
  
  document.getElementById('sas-nordic-welcome').innerHTML = html;
  populateLabels();
})();
</script>
