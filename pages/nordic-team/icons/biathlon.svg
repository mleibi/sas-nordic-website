<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="120" height="120">
  <style>
    .s { fill: none; stroke: #fff; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke-width: 2.4; }
    .ski { stroke-width: 3.6; }
    .gun { animation: recoil 3s linear infinite; }
    .flash { opacity: 0; animation: flash 3s linear infinite; transform-box: fill-box; transform-origin: center; }
    .t { fill: rgba(255, 255, 255, 0); stroke: #fff; stroke-width: 2.4; }
    .t1 { animation: hit1 3s linear infinite; }
    .t2 { animation: hit2 3s linear infinite; }
    .t3 { animation: hit3 3s linear infinite; }
    @keyframes recoil { 0%, 11%, 15%, 31%, 35%, 51%, 55%, 100% { transform: translateX(0); } 12%, 32%, 52% { transform: translateX(-2.5px); } }
    @keyframes flash { 0%, 10%, 15%, 30%, 35%, 50%, 55%, 100% { opacity: 0; transform: scale(0.4); } 11%, 31%, 51% { opacity: 1; transform: scale(1.2); } }
    @keyframes hit1 { 0%, 12% { fill: rgba(255, 255, 255, 0); } 14%, 88% { fill: #fff; } 96%, 100% { fill: rgba(255, 255, 255, 0); } }
    @keyframes hit2 { 0%, 32% { fill: rgba(255, 255, 255, 0); } 34%, 88% { fill: #fff; } 96%, 100% { fill: rgba(255, 255, 255, 0); } }
    @keyframes hit3 { 0%, 52% { fill: rgba(255, 255, 255, 0); } 54%, 88% { fill: #fff; } 96%, 100% { fill: rgba(255, 255, 255, 0); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g class="shooter">
    <polyline class="s" points="33,58 26,72 27,85"/>
    <polyline class="s" points="33,58 40,71 40,85"/>
    <line class="s ski" x1="12" y1="87" x2="56" y2="87"/>
    <line class="s" x1="35" y1="34" x2="33" y2="58"/>
    <circle cx="36" cy="23" r="6.5" fill="#fff"/>
    <g class="gun">
      <line class="s" x1="30" y1="38" x2="66" y2="33" stroke-width="4"/>
      <polyline class="s" points="35,36 45,44 52,35"/>
      <polyline class="s" points="35,36 40,38"/>
      <polygon class="flash" points="70,33 75,29 74,33 79,33 74,35 75,38" fill="#ffd56b"/>
    </g>
  </g>
  <line class="s thin" x1="88" y1="16" x2="88" y2="62" opacity="0.5"/>
  <circle class="t t1" cx="88" cy="22" r="5"/>
  <circle class="t t2" cx="88" cy="38" r="5"/>
  <circle class="t t3" cx="88" cy="54" r="5"/>
</svg>
