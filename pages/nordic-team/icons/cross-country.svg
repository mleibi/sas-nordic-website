<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="120" height="120">
  <style>
    .s { fill: none; stroke: #fff; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; }
    .pole { stroke-width: 2.6; }
    .ski { stroke-width: 3.8; }
    .body { animation: bob 1.4s ease-in-out infinite; }
    .leg, .arm, .skiA { transform-box: view-box; }
    .leg { transform-origin: 44px 57px; animation: leg 1.4s ease-in-out infinite; }
    .skiA { animation: ski 1.4s ease-in-out infinite; }
    .arm { transform-origin: 58px 36px; animation: arm 1.4s ease-in-out infinite; }
    .b { animation-delay: -0.7s; }
    .track { animation: track 0.5s linear infinite; opacity: 0.55; }
    .streak { animation: streak 1s linear infinite; }
    .b2 { animation-delay: -0.33s; }
    .b3 { animation-delay: -0.66s; }
    @keyframes bob { 0%, 50%, 100% { transform: translateY(0); } 15%, 65% { transform: translateY(-1px); } }
    @keyframes leg { 0%, 100% { transform: rotate(-13deg); } 30%, 50% { transform: rotate(13deg); } 80% { transform: rotate(-13deg); } }
    @keyframes ski { 0%, 100% { transform: translateX(6.3px); } 30%, 50% { transform: translateX(-6.3px); } 80% { transform: translateX(6.3px); } }
    @keyframes arm { 0%, 100% { transform: rotate(-30deg); } 30%, 50% { transform: rotate(26deg); } 80% { transform: rotate(-30deg); } }
    @keyframes track { from { transform: translateX(0); } to { transform: translateX(-20px); } }
    @keyframes streak { 0% { transform: translateX(14px); opacity: 0; } 30% { opacity: 0.8; } 100% { transform: translateX(-16px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <line class="s track" x1="0" y1="92" x2="120" y2="92" stroke-dasharray="10 10" stroke-width="2.5"/>
  <line class="s streak" x1="10" y1="36" x2="22" y2="36" stroke-width="2.4"/>
  <line class="s streak b2" x1="6" y1="48" x2="20" y2="48" stroke-width="2.4"/>
  <line class="s streak b3" x1="10" y1="60" x2="20" y2="60" stroke-width="2.4"/>
  <g class="body">
    <g class="skiA b"><line class="s ski" x1="30" y1="87" x2="60" y2="87"/></g>
    <g class="leg b"><polyline class="s" points="44,57 48,71 45,85"/></g>
    <g class="arm"><polyline class="s" points="58,36 58,47 63,54"/><line class="s pole" x1="65" y1="45" x2="49" y2="91"/></g>
    <line class="s" x1="58" y1="36" x2="44" y2="57"/>
    <circle cx="65" cy="26" r="6.5" fill="#fff"/>
    <g class="skiA"><line class="s ski" x1="30" y1="87" x2="60" y2="87"/></g>
    <g class="leg"><polyline class="s" points="44,57 48,71 45,85"/></g>
    <g class="arm b"><polyline class="s" points="58,36 58,47 63,54"/><line class="s pole" x1="65" y1="45" x2="49" y2="91"/></g>
  </g>
</svg>
