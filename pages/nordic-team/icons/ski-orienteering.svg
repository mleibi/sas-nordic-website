<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="120" height="120">
  <style>
    .s { fill: none; stroke: #fff; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; }
    .pole { stroke-width: 2.6; }
    .ski { stroke-width: 3.8; }
    .upper { transform-box: view-box; transform-origin: 32px 58px; animation: crunch 1.1s ease-in-out infinite; }
    .arm { transform-box: view-box; transform-origin: 46px 38px; animation: pole 1.1s ease-in-out infinite; }
    @keyframes crunch { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(14deg); } }
    @keyframes pole { 0%, 100% { transform: rotate(-30deg); } 50% { transform: rotate(26deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g class="flag">
    <line class="s" x1="80" y1="48" x2="80" y2="12" stroke-width="2.6"/>
    <g transform="translate(81 13)">
      <rect width="15" height="15" fill="#fff"/>
      <polygon points="15,0 15,15 0,15" fill="#f28c28"/>
    </g>
  </g>
  <line class="s ski" x1="14" y1="87" x2="54" y2="87"/>
  <polyline class="s" points="32,58 37,72 34,85"/>
  <polyline class="s" points="32,58 28,72 26,85"/>
  <g class="upper">
    <g class="arm"><polyline class="s" points="46,38 46,49 51,55" opacity="0.75"/><line class="s pole" x1="51" y1="52" x2="40" y2="88" opacity="0.75"/></g>
    <line class="s" x1="46" y1="38" x2="32" y2="58"/>
    <circle cx="52" cy="28" r="6.5" fill="#fff"/>
    <rect x="44" y="42" width="13" height="10" rx="1.5" fill="#fff" transform="rotate(-35 50.5 47)"/>
    <line x1="47" y1="45" x2="54" y2="49" stroke="#0a3d62" stroke-width="1.2" transform="rotate(-35 50.5 47)"/>
    <g class="arm"><polyline class="s" points="46,38 50,49 56,54"/><line class="s pole" x1="56" y1="51" x2="47" y2="88"/></g>
  </g>
</svg>
